name: Golden E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  golden-e2e:
    name: Full-stack golden browser/PDF E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swim_analysis
          POSTGRES_USER: swim
          POSTGRES_PASSWORD: swim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://swim:swim@127.0.0.1:5432/swim_analysis
      UPLOAD_DIR: ${{ github.workspace }}/backend/e2e-uploads
      PDF_RENDER_BASE_URL: http://127.0.0.1:5174
      FRONTEND_BASE_URL: http://127.0.0.1:5174
      BACKEND_PUBLIC_BASE_URL: http://127.0.0.1:8001
      VITE_DEV_PROXY_TARGET: http://127.0.0.1:8001
      GOLDEN_E2E_ENABLED: "1"
      GOLDEN_E2E_BACKEND_URL: http://127.0.0.1:8001
      GOLDEN_E2E_FRONTEND_URL: http://127.0.0.1:5174

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock anyio

      - name: Install Chromium and FFmpeg
        working-directory: backend
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up database
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > "$GITHUB_WORKSPACE/backend-e2e.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend-e2e.pid"
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8001/health >/dev/null && exit 0
            sleep 1
          done
          echo "E2E_INFRA_ERROR:BACKEND_STARTUP_TIMEOUT"
          cat "$GITHUB_WORKSPACE/backend-e2e.log"
          exit 1

      - name: Start frontend
        working-directory: frontend-vue
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5174 > "$GITHUB_WORKSPACE/frontend-e2e.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/frontend-e2e.pid"
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:5174/ >/dev/null && exit 0
            sleep 1
          done
          echo "E2E_INFRA_ERROR:FRONTEND_STARTUP_TIMEOUT"
          cat "$GITHUB_WORKSPACE/frontend-e2e.log"
          exit 1

      - name: Run golden E2E
        run: |
          set +e
          python -m pytest -q backend/tests/e2e -m golden_e2e --tb=short
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- backend log ---"
            cat backend-e2e.log || true
            echo "--- frontend log ---"
            cat frontend-e2e.log || true
          fi
          exit "$status"

      - name: Stop E2E services
        if: always()
        run: |
          kill "$(cat backend-e2e.pid)" 2>/dev/null || true
          kill "$(cat frontend-e2e.pid)" 2>/dev/null || true
