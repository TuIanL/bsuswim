  - 由角度偏大直接诊断核心力量不足
  coach_text: 在{phase}阶段，身体轴相对画面水平角{trend}，同时髋部位置{hip_trend}。这提示身体流线型控制可能{assessment}，建议结合呼吸周期和速度复核。
  actions:
  - 流线型滑行
  - 侧身打腿与身体对齐练习
  - 在固定配速下比较呼吸与非呼吸周期
  audience:
  - coach
  - athlete
  applicable_pipelines:
  - side_2d_kinematics_5page
  interpretations:
  - 角度增大且髋部明显下沉时，可提示流线型控制可能下降。
  - 高速度下角度改善可能来自更强推进、打腿或浮力/姿态变化，不能单独归因。
  alternatives:
  - 呼吸抬头
  - 打腿节奏变化
  - 镜头俯仰
  - 转身后加速
  - 身体滚转投影
  required_evidence:
