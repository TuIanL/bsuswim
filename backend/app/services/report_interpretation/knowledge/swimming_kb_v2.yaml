  version: '1.0'
  title: 髋部垂直波动反映姿态稳定，但必须先去除镜头运动
  summary: 髋部上下波动过大可能增加姿态变化和迎水面积，但移动摄像机、泳道波浪、呼吸和身体滚转也会造成表观波动。
