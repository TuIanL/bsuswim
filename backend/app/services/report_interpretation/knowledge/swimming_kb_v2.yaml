entries:
- knowledge_id: KB-001
  version: '1.0'
  title: 速度、划频与划幅必须联合解释
  summary: 游速可分解为划频与划幅的组合。速度提高可能来自划频增加、划幅增加或两者共同变化；不存在对所有距离和所有运动员都适用的单一“最佳划频”或“最佳划幅”。
  stroke_types:
  - freestyle
  metric_keys:
  - speed
  - stroke_length
  - stroke_rate
  finding_codes: []
  athlete_levels: []
  training_goals: []
  contraindications: []
  source_title: '游泳表现分析知识库 v1：Stroke rate–stroke length dynamics in elite freestyle swimming (2025), Factors
    Relating to Sprint Swimming Performance: A Systematic Review (2024), Kinematic, arm-stroke efficiency,
    coordination, and energetic parameters of the 400-m front crawl: systematic review and meta-analysis
    (2023)'
  source_locator: swim_knowledge_base_v1#KB-001
  review_status: inactive
  reviewed_by: swim-knowledge-base-v1-authors
  reviewed_at: '2026-07-31'
  domain: measurement_governance
  view_types: []
  distance_contexts: []
  evidence_level: high
  forbidden:
  - 仅凭划频高就下结论“动作急促”
  - 仅凭划幅低就下结论“力量不足”
  coach_text: 本次速度变化主要由{dominant_factor}驱动。建议将划频和划幅放在同一速度区间内联合观察，而不是单独追求某一个数值。
  actions:
  - 在固定配速下比较不同划频
  - 在固定划频下比较速度和划幅
  - 按速度区间建立个人基线
  audience:
  - coach
  - athlete
  applicable_pipelines: []
  interpretations:
  - 同一速度下，较低划频与较大划幅通常代表不同的技术策略，不应自动判定优劣。
  - 短距离、长距离、疲劳阶段和战术目标会改变合理组合。
  alternatives:
  - 身高与臂展
  - 比赛距离
  - 转身与水下段比例
  - 疲劳程度
  - 技术水平
  required_evidence:
  - 准确的距离和时间
  - 统一的划水计数口径
  - 相同泳姿、泳池长度和强度
  source_records:
  - title: Stroke rate–stroke length dynamics in elite freestyle swimming (2025)
