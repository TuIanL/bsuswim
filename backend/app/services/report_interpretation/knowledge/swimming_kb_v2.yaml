    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10813451/
- knowledge_id: KB-004
  version: '1.0'
  title: 身体轴角用于描述姿态趋势，不应单独判断阻力大小
  summary: 身体更接近水平通常有助于减小迎水面积，但真实主动阻力还受到速度、形态、姿态变化和流体条件影响。身体轴角应与髋位、头部动作、速度和关键帧一起解释。
  stroke_types:
  - freestyle
  metric_keys:
  - body_axis_angle_deg
  - torso_axis_angle_deg
