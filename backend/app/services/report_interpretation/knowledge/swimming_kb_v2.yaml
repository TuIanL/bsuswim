- knowledge_id: KB-006
  version: '1.0'
  title: 头部抬升应与呼吸和躯干滚转共同判断
  summary: 自由泳呼吸会产生预期的头部运动；关键不是头部完全不动，而是头部是否与身体滚转协调，以及是否出现额外抬头、延迟回正或突变。
