- knowledge_id: KB-002
  version: '1.0'
  title: SWOLF只适合严格同条件纵向比较
  summary: SWOLF把单趟用时与划水次数相加，可作为训练反馈，但受到泳池长度、计数方式、身高、出发转身和水下段影响。它更适合比较同一运动员在相同泳池、距离、泳姿和强度下的变化。
  stroke_types: []
  metric_keys:
  - swolf
  finding_codes: []
  athlete_levels: []
  training_goals: []
  contraindications: []
  source_title: 游泳表现分析知识库 v1：U.S. Masters Swimming — Balancing Stroke Rate and Stroke Efficiency, Validation
    of Automatically Quantified Swim Stroke Mechanics Using an IMU (2024)
  source_locator: swim_knowledge_base_v1#KB-002
  review_status: inactive
  reviewed_by: swim-knowledge-base-v1-authors
  reviewed_at: '2026-07-31'
  domain: measurement_governance
  view_types: []
  distance_contexts: []
  evidence_level: moderate
  forbidden:
  - 跨运动员直接排名
  - 跨泳池长度直接比较
  - 将较低SWOLF等同于绝对技术更好
  coach_text: 本次SWOLF{trend}，但应结合用时和划水次数拆分原因；该值仅与本人相同条件历史记录比较。
  actions:
  - 固定条件复测
  - 同时显示时间与划水次数
  - 记录计数口径
  audience:
  - coach
  - athlete
  applicable_pipelines: []
  interpretations:
  - SWOLF下降可能来自更快速度、较少划水或两者共同作用。
  - 过度滑行也可能减少划水次数却损害速度，因此仍需同时看用时。
  alternatives:
  - 25米与50米泳池
  - 手表按单臂或完整周期计数
  - 出发/转身距离
  - 训练强度
  required_evidence:
  - 泳池长度
  - 计数定义
  - 单趟用时
  - 泳姿与强度
  source_records:
  - title: U.S. Masters Swimming — Balancing Stroke Rate and Stroke Efficiency
    type: official_coaching
    url: https://www.usms.org/fitness-and-training/articles-and-videos/articles/balancing-stroke-rate-and-stroke-efficiency
  - title: Validation of Automatically Quantified Swim Stroke Mechanics Using an IMU (2024)
    type: validation_study
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10813451/
- knowledge_id: KB-003
  version: '1.0'
  title: 二维侧视角不能直接代表真实三维技术
  summary: 二维侧视视频把三维动作投影到画面平面，身体滚转、前后深度、遮挡和镜头运动都会改变测得角度与轨迹。所有结论必须注明“二维侧视代理指标”。
  stroke_types: []
  metric_keys:
  - all_2d
  finding_codes: []
  athlete_levels: []
  training_goals: []
  contraindications: []
  source_title: '游泳表现分析知识库 v1：Numerical and experimental methods used to evaluate active drag in swimming:
    a review (2022), Movement evaluation of front crawl swimming: Technical skill versus aesthetic quality
    (2017), Validation of Automatically Quantified Swim Stroke Mechanics Using an IMU (2024)'
  source_locator: swim_knowledge_base_v1#KB-003
  review_status: active
  reviewed_by: swim-knowledge-base-v1-authors
  reviewed_at: '2026-07-31'
  domain: data_quality
  view_types:
  - side
  distance_contexts: []
  evidence_level: high
  forbidden:
  - 把画面水平角写成水面夹角
  - 用侧视单机位判断左右真实对称性
  - 用二维角度直接计算三维关节力矩
  coach_text: 该结果来自二维侧视画面，适合识别趋势和代表帧，不等同于完整三维生物力学结论。
  actions:
  - 优先做同条件复测
  - 保存置信度和可见性
  - 必要时增加正面或水下机位
  audience:
  - coach
  - athlete
  applicable_pipelines:
  - side_2d_kinematics_5page
  interpretations:
  - 角度变化可能来自真实动作，也可能来自滚转、透视或摄像机移动。
  - 同一运动员同一机位的纵向比较通常比跨人横向比较更可靠。
  alternatives:
  - 身体滚转
  - 镜头平移/俯仰
  - 广角畸变
  - 关键点遮挡
  - 泳道位置变化
  required_evidence:
  - 机位与镜头参数
  - 运动补偿状态
  - 关键点可见性
  - 测量基准说明
